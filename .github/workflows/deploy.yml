name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: workflow-api
  API_FUNCTION: workflow-api
  MIGRATE_FUNCTION: workflow-migrate
  EMAIL_WORKER_FUNCTION: workflow-email-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker buildx build --platform linux/amd64 --provenance=false -t "$IMAGE" --push .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Image pushed: $IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Update API function
        run: |
          aws lambda update-function-code --function-name "$API_FUNCTION" --image-uri "$IMAGE" > /dev/null
          aws lambda wait function-updated --function-name "$API_FUNCTION"
          echo "Updated $API_FUNCTION" >> "$GITHUB_STEP_SUMMARY"

      - name: Update migration function
        run: |
          aws lambda update-function-code --function-name "$MIGRATE_FUNCTION" --image-uri "$IMAGE" > /dev/null
          aws lambda wait function-updated --function-name "$MIGRATE_FUNCTION"
          echo "Updated $MIGRATE_FUNCTION (run it manually if this release has database changes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Update email worker function
        run: |
          aws lambda update-function-code --function-name "$EMAIL_WORKER_FUNCTION" --image-uri "$IMAGE" > /dev/null
          aws lambda wait function-updated --function-name "$EMAIL_WORKER_FUNCTION"
          echo "Updated $EMAIL_WORKER_FUNCTION" >> "$GITHUB_STEP_SUMMARY"
